# Evolution API - stack de despliegue para VPS con Traefik + n8n preexistentes.
#
# Diseñado para un servidor que YA tiene:
#   - Traefik (v3) como reverse proxy, dueño de los puertos 80/443,
#     con certresolver "mytlschallenge" y providers.docker.exposedbydefault=false
#   - n8n y un Postgres, ambos en la red Docker "n8n_default"
#
# Evolution NO publica puertos al host: todo el tráfico entra por Traefik con TLS.
# El manager (donde se escanea el QR) viene integrado en la propia API, en /manager.
#
# Uso:
#   cd /docker/evolution
#   cp .env.example .env   &&   editar .env
#   docker compose up -d

name: evolution

services:
  api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # Credenciales de sesión de Baileys. Si se pierde este volumen,
      # hay que volver a escanear el QR.
      - evolution_instances:/evolution/instances
    networks:
      # Red compartida: por aquí lo alcanzan Traefik y n8n.
      - n8n_default
      # Red privada del stack: solo api <-> redis.
      - internal
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      # Traefik está en varias redes potenciales: le decimos por cuál hablar.
      traefik.docker.network: "n8n_default"

      traefik.http.routers.evolution.rule: "Host(`evo.tbadigitals.com`)"
      traefik.http.routers.evolution.entrypoints: "web,websecure"
      traefik.http.routers.evolution.tls: "true"
      traefik.http.routers.evolution.tls.certresolver: "mytlschallenge"
      traefik.http.routers.evolution.middlewares: "evolution-headers@docker"
      traefik.http.services.evolution.loadbalancer.server.port: "8080"

      traefik.http.middlewares.evolution-headers.headers.SSLRedirect: "true"
      traefik.http.middlewares.evolution-headers.headers.forceSTSHeader: "true"
      traefik.http.middlewares.evolution-headers.headers.STSSeconds: "31536000"
      traefik.http.middlewares.evolution-headers.headers.STSIncludeSubdomains: "true"
      traefik.http.middlewares.evolution-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.evolution-headers.headers.browserXSSFilter: "true"

  redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "192mb"
      - --maxmemory-policy
      - "noeviction"
    volumes:
      - evolution_redis:/data
    networks:
      internal:
        aliases:
          - evolution-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  evolution_instances:
  evolution_redis:

networks:
  # Creada por el stack de n8n. Debe existir antes de levantar esto.
  n8n_default:
    external: true
  internal:
    driver: bridge
